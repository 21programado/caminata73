<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruteador Peatonal Urbano</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <!-- Papa Parse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body class="bg-slate-900 h-screen w-screen overflow-hidden font-sans text-slate-100">

  <!-- Mapa a Pantalla Completa -->
  <div id="map" class="z-0"></div>

  <!-- Panel Flotante de Búsqueda y Control -->
  <div class="absolute top-4 left-4 z-[1000] w-80 sm:w-96 bg-slate-900/90 backdrop-blur-md p-4 rounded-xl border border-slate-700 shadow-2xl space-y-3">
    
    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
      <div>
        <h1 class="font-bold text-sm text-emerald-400">Ruteador Peatonal 🚶</h1>
        <p class="text-[11px] text-slate-400" id="sub-header">Cargando base de datos...</p>
      </div>
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] font-semibold px-2 py-1 rounded border border-slate-600 transition">
        <span>Subir CSV</span>
        <input type="file" id="file-input" accept=".csv" class="hidden">
      </label>
    </div>

    <!-- Buscador flexible -->
    <div class="flex gap-2">
      <input type="text" id="search-input" placeholder="Ej: bulevar, 6413, 12900..." 
             class="w-full px-3 py-2 text-xs bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <button id="btn-search" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-semibold transition shrink-0">
        Buscar
      </button>
    </div>

    <!-- Botón Mi GPS -->
    <button id="btn-gps" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2 rounded-lg shadow transition flex items-center justify-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span>Actualizar Mi GPS</span>
    </button>

    <!-- Resumen de Ruta Activa a Pie -->
    <div id="route-panel" class="hidden pt-2 border-t border-slate-700 text-xs space-y-1.5">
      <div class="font-bold text-emerald-400 flex justify-between items-center">
        <span>Ruta Peatonal Activa</span>
        <button id="btn-clear-route" class="text-slate-400 hover:text-white text-[10px] underline">Borrar ruta</button>
      </div>
      <div class="grid grid-cols-2 gap-2 bg-slate-800/80 p-2 rounded border border-slate-700 text-center">
        <div><span class="text-slate-400 text-[10px] block">Distancia:</span> <span id="route-dist" class="font-bold text-white text-xs">-</span></div>
        <div><span class="text-slate-400 text-[10px] block">Tiempo a pie:</span> <span id="route-time" class="font-bold text-emerald-300 text-xs">-</span></div>
      </div>
      <div id="route-dest-name" class="text-slate-300 text-[11px] truncate"></div>
    </div>
  </div>

  <!-- Indicador de Carga Flotante -->
  <div id="loading-badge" class="absolute bottom-6 left-6 bg-slate-900/90 backdrop-blur text-white px-4 py-2 rounded-lg text-xs shadow-lg z-[1000] hidden border border-slate-700">
    Procesando...
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  
  <script>
    let map = null;
    let markersCluster = null;
    let allData = [];
    let userMarker = null;
    let userCoords = [-34.88, -56.16]; 
    let routeLineLayer = null;

    function initMap() {
      // Registrar Service Worker para PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registrado con éxito.'))
          .catch(err => console.log('Error al registrar Service Worker:', err));
      }

      const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      });

      map = L.map('map', {
        center: userCoords,
        zoom: 13,
        layers: [osmStandard]
      });

      markersCluster = L.markerClusterGroup({ chunkedLoading: true });
      map.addLayer(markersCluster);

      const userIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });

      userMarker = L.marker(userCoords, { draggable: true, icon: userIcon, title: "Tu posición (Arrastrable)" }).addTo(map);
      userMarker.bindPopup("<b>Tu posición de partida</b><br>Arrastra este marcador o haz clic derecho en el mapa para moverlo.");

      userMarker.on('dragend', function(e) {
        const pos = e.target.getLatLng();
        userCoords = [pos.lat, pos.lng];
      });

      map.on('contextmenu', function(e) {
        userCoords = [e.latlng.lat, e.latlng.lng];
        userMarker.setLatLng(userCoords);
        userMarker.bindPopup("<b>Partida ajustada manualmente</b>").openPopup();
      });

      getGPSLocation(false);
      tryAutoLoadCSV();
    }

    function getGPSLocation(showAlerts = true) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          position => {
            userCoords = [position.coords.latitude, position.coords.longitude];
            userMarker.setLatLng(userCoords);
            map.setView(userCoords, 16);
            userMarker.bindPopup("<b>¡Ubicación GPS actual detectada!</b>").openPopup();
          },
          error => {
            if (showAlerts) alert("No se pudo obtener el GPS.");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else if (showAlerts) {
        alert("Tu dispositivo no admite geolocalización.");
      }
    }

async function tryAutoLoadCSV() {
      const badge = document.getElementById('loading-badge');
      badge.classList.remove('hidden');
      badge.innerText = "Cargando bases de datos de calles...";

      const fileParts = ['direcciones_parte1.csv', 'direcciones_parte2.csv'];
      let combinedData = [];
      let successCount = 0;

      for (const fileName of fileParts) {
        try {
          const response = await fetch(fileName);
          if (response.ok) {
            const csvText = await response.text();
            
            // Parsear de forma síncrona/prometida cada parte
            await new Promise((resolve) => {
              Papa.parse(csvText, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                  const valid = results.data.filter(row => row.latitud && row.longitud);
                  combinedData = combinedData.concat(valid);
                  successCount++;
                  resolve();
                }
              });
            });
          }
        } catch (e) {
          console.log(`No se pudo cargar ${fileName}`);
        }
      }

      badge.classList.add('hidden');

      if (successCount > 0) {
        allData = combinedData;
        document.getElementById('sub-header').innerText = `Montevideo peatonal (${allData.length} puntos)`;
        renderMarkers(allData);
      } else {
        document.getElementById('sub-header').innerText = "Sube tus archivos CSV para comenzar.";
      }
    }

    function processCSVData(csvText, sourceName) {
      const badge = document.getElementById('loading-badge');
      badge.classList.remove('hidden');
      badge.innerText = "Cargando direcciones...";

      setTimeout(() => {
        Papa.parse(csvText, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: function(results) {
            allData = results.data.filter(row => row.latitud && row.longitud);
            document.getElementById('sub-header').innerText = `${sourceName} (${allData.length} puntos)`;
            badge.classList.add('hidden');
            renderMarkers(allData);
          }
        });
      }, 50);
    }

    function renderMarkers(data) {
      markersCluster.clearLayers();
      if (data.length === 0) return;

      const markersToAdd = [];

      data.forEach(row => {
        const lat = parseFloat(row.latitud);
        const lon = parseFloat(row.longitud);
        if (isNaN(lat) || isNaN(lon)) return;

        const marker = L.marker([lat, lon]);

        marker.bindPopup(`
          <div class="text-xs leading-relaxed font-sans min-w-[200px] text-slate-800">
            <div class="font-bold text-sm border-b pb-1 mb-2 border-slate-200">
              ${row.nombre_via || 'Vía'} #${row.num_puerta || 'S/N'}
            </div>
            <div><b>Localidad:</b> ${row.localidad || 'N/A'}</div>
            <div><b>CP:</b> ${row.codigo_postal || 'N/A'}</div>
            <button onclick="calculateWalkingRoute(${lat}, ${lon}, '${row.nombre_via || 'Destino'} #${row.num_puerta || ''}')" 
                    class="mt-3 w-full bg-emerald-600 text-white font-semibold py-1.5 px-2 rounded hover:bg-emerald-500 transition">
              Caminar hacia aquí 🚶
            </button>
          </div>
        `);

        markersToAdd.push(marker);
      });

      markersCluster.addLayers(markersToAdd);
    }

    // Ruta OSRM perfil peatonal ('foot') con cálculo de tiempo humano real
    async function calculateWalkingRoute(destLat, destLon, destName) {
      const badge = document.getElementById('loading-badge');
      badge.classList.remove('hidden');
      badge.innerText = "Calculando ruta a pie...";

      const startLon = userCoords[1];
      const startLat = userCoords[0];
      const osrmUrl = `https://router.project-osrm.org/route/v1/foot/${startLon},${startLat};${destLon},${destLat}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();

        if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

          if (routeLineLayer) {
            map.removeLayer(routeLineLayer);
          }

          routeLineLayer = L.polyline(coords, { color: '#34d399', weight: 6, opacity: 0.9, dashArray: '5, 10' }).addTo(map);
          map.fitBounds(routeLineLayer.getBounds(), { padding: [80, 80] });

          // Cálculo humano: ~4.8 km/h (80 metros por minuto)
          const velocidadMetrosPorMinuto = 80;
          const minutosEstimados = Math.round(route.distance / velocidadMetrosPorMinuto);

          document.getElementById('route-panel').classList.remove('hidden');
          document.getElementById('route-dist').innerText = (route.distance / 1000).toFixed(2) + ' km';
          document.getElementById('route-time').innerText = minutosEstimados + ' min';
          document.getElementById('route-dest-name').innerText = `Destino: ${destName}`;
        } else {
          alert('No se encontró una ruta peatonal conectada.');
        }
      } catch (e) {
        alert('Error al conectar con el servidor de rutas.');
      } finally {
        badge.classList.add('hidden');
      }
    }

    function performSearch() {
      const rawTerm = document.getElementById('search-input').value.trim();
      if (!rawTerm) {
        renderMarkers(allData);
        return;
      }
      
      const term = rawTerm.toLowerCase();
      const filtered = allData.filter(row => {
        const text = `${row.nombre_via || ''} ${row.num_puerta || ''} ${row.codigo_postal || ''} ${row.localidad || ''}`.toLowerCase();
        return text.includes(term);
      });

      renderMarkers(filtered);

      if (filtered.length > 0) {
        const target = filtered[0];
        const lat = parseFloat(target.latitud);
        const lon = parseFloat(target.longitud);

        if (!isNaN(lat) && !isNaN(lon)) {
          calculateWalkingRoute(lat, lon, `${target.nombre_via || 'Destino'} #${target.num_puerta || ''}`);
        }
      } else {
        alert("No se encontraron coincidencias.");
      }
    }

    document.getElementById('btn-clear-route').addEventListener('click', () => {
      if (routeLineLayer) {
        map.removeLayer(routeLineLayer);
        routeLineLayer = null;
      }
      document.getElementById('route-panel').classList.add('hidden');
    });

    document.getElementById('btn-gps').addEventListener('click', () => getGPSLocation(true));
    document.getElementById('btn-search').addEventListener('click', performSearch);
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => processCSVData(evt.target.result, file.name);
        reader.readAsText(file);
      }
    });

    window.onload = initMap;
  </script>
</body>
</html>
