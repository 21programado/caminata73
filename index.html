<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruteador Peatonal Urbano</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    #map { height: 100vh; width: 100vw; }
    #suggestions-box { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  </style>
</head>
<body class="bg-slate-900 h-screen w-screen overflow-hidden font-sans text-slate-100">

  <div id="map" class="z-0"></div>

  <div id="panel" class="absolute top-4 left-4 z-[1000] w-80 sm:w-96 bg-slate-900/90 backdrop-blur-md p-4 rounded-xl border border-slate-700 shadow-2xl space-y-3">

    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
      <div>
        <h1 class="font-bold text-sm text-emerald-400">Ruteador Peatonal 🚶</h1>
        <p class="text-[11px] text-slate-400" id="sub-header">Cargando base de datos...</p>
      </div>
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] font-semibold px-2 py-1 rounded border border-slate-600 transition">
        <span>Subir CSV</span>
        <input type="file" id="file-input" accept=".csv" class="hidden">
      </label>
    </div>

    <div class="relative">
      <div class="flex gap-2">
        <input type="text" id="search-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
               placeholder="Ej: 8 de Octubre, 2500..."
               class="w-full px-3 py-2 text-base sm:text-xs bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <button id="btn-search" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-semibold transition shrink-0">Buscar</button>
      </div>
      <div id="suggestions-box" class="absolute left-0 right-0 mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-2xl max-h-56 overflow-y-auto z-[9999] hidden"></div>
    </div>

    <button id="btn-gps" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2 rounded-lg shadow transition flex items-center justify-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span>Actualizar Mi GPS</span>
    </button>

    <div id="route-panel" class="hidden pt-2 border-t border-slate-700 text-xs space-y-1.5">
      <div class="font-bold text-emerald-400 flex justify-between items-center">
        <span>Ruta Peatonal Activa</span>
        <button id="btn-clear-route" class="text-slate-400 hover:text-white text-[10px] underline">Borrar ruta</button>
      </div>
      <div class="grid grid-cols-2 gap-2 bg-slate-800/80 p-2 rounded border border-slate-700 text-center">
        <div><span class="text-slate-400 text-[10px] block">Distancia:</span> <span id="route-dist" class="font-bold text-white text-xs">-</span></div>
        <div><span class="text-slate-400 text-[10px] block">Tiempo a pie:</span> <span id="route-time" class="font-bold text-emerald-300 text-xs">-</span></div>
      </div>
      <div id="route-dest-name" class="text-slate-300 text-[11px] truncate"></div>
    </div>
  </div>

  <div id="loading-badge" class="absolute bottom-6 left-6 bg-slate-900/90 backdrop-blur text-white px-4 py-2 rounded-lg text-xs shadow-lg z-[1000] hidden border border-slate-700">Procesando...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <script>
    let map, markersCluster, userMarker, routeLineLayer;
    let allData = [];        // filas ya limpias (con lat/lon numéricos y nombre normalizado)
    let streetIndex = [];    // calles únicas: { n: nombre normalizado, name: nombre original }
    let userCoords = [-34.88, -56.16];

    const $ = id => document.getElementById(id);
    const input = $('search-input');
    const box = $('suggestions-box');

    // Minúsculas y sin tildes, para que "ocho"/"Óscar" etc. coincidan sin importar acentos
    const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // ---------- Preparación de datos (una sola vez) ----------
    function prepareData(rows) {
      const names = new Map();
      const clean = [];
      for (const r of rows) {
        const lat = parseFloat(r.latitud), lon = parseFloat(r.longitud);
        if (isNaN(lat) || isNaN(lon)) continue;
        r.lat = lat; r.lon = lon;
        r.via = String(r.nombre_via ?? '').trim();   // String() evita el error si el CSV trae nombres numéricos
        r.viaN = norm(r.via);
        if (r.via && !names.has(r.viaN)) names.set(r.viaN, r.via);
        clean.push(r);
      }
      allData = clean;
      streetIndex = [...names].map(([n, name]) => ({ n, name }));
    }

    function parseQuery(raw) {
      const parts = raw.trim().split(/[\s,]+/);
      const last = parts[parts.length - 1];
      if (parts.length > 1 && /^\d+$/.test(last)) return { street: parts.slice(0, -1).join(' '), number: last };
      return { street: raw.trim(), number: null };
    }

    // ---------- Sugerencias ----------
    function getSuggestions(term) {
      const t = norm(term);
      if (t.length < 2) return [];
      const starts = [], wordStarts = [], inside = [];
      for (const s of streetIndex) {
        const i = s.n.indexOf(t);
        if (i === 0) starts.push(s.name);
        else if (i > 0) (s.n[i - 1] === ' ' ? wordStarts : inside).push(s.name);
      }
      return starts.concat(wordStarts, inside).slice(0, 15);
    }

    function hideSuggestions() { box.classList.add('hidden'); box.innerHTML = ''; }

    function showSuggestions() {
      const raw = input.value;
      let list = getSuggestions(raw);
      if (!list.length) list = getSuggestions(parseQuery(raw).street); // por si ya escribió el número
      if (!list.length) return hideSuggestions();
      box.innerHTML = list.map(n =>
        `<div class="sug px-3 py-3 text-sm sm:text-xs text-slate-200 active:bg-emerald-600 hover:bg-emerald-600 hover:text-white cursor-pointer border-b border-slate-700/50 last:border-none" data-name="${esc(n)}">${esc(n)}</div>`
      ).join('');
      box.classList.remove('hidden');
    }

    let debounce;
    input.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(showSuggestions, 120); });
    input.addEventListener('focus', () => { if (input.value.trim().length >= 2) showSuggestions(); });

    // Un solo evento "click" sirve para mouse y toque (sin touchend, que se disparaba al hacer scroll en la lista)
    box.addEventListener('click', e => {
      const el = e.target.closest('.sug');
      if (!el) return;
      input.value = el.dataset.name;
      hideSuggestions();
      input.blur();            // cierra el teclado en el celular
      performSearch();
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('#search-input') && !e.target.closest('#suggestions-box')) hideSuggestions();
    });

    // ---------- Mapa ----------
    function initMap() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW:', err));
      }

      map = L.map('map', {
        center: userCoords, zoom: 13,
        layers: [L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' })]
      });

      // Evita que los toques/arrastres/scroll sobre el panel muevan el mapa (clave en celular)
      const panel = $('panel');
      L.DomEvent.disableClickPropagation(panel);
      L.DomEvent.disableScrollPropagation(panel);

      markersCluster = L.markerClusterGroup({ chunkedLoading: true });
      map.addLayer(markersCluster);

      const userIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
      });

      userMarker = L.marker(userCoords, { draggable: true, icon: userIcon, title: 'Tu posición (arrastrable)' }).addTo(map);
      userMarker.bindPopup('<b>Tu posición de partida</b><br>Arrastra este marcador o haz clic derecho en el mapa para moverlo.');
      userMarker.on('dragend', e => { const p = e.target.getLatLng(); userCoords = [p.lat, p.lng]; });

      map.on('contextmenu', e => {
        userCoords = [e.latlng.lat, e.latlng.lng];
        userMarker.setLatLng(userCoords);
        userMarker.bindPopup('<b>Partida ajustada manualmente</b>').openPopup();
      });

      getGPSLocation(false);
      tryAutoLoadCSV();
    }

    function getGPSLocation(showAlerts = true) {
      if (!navigator.geolocation) { if (showAlerts) alert('Tu dispositivo no admite geolocalización.'); return; }
      navigator.geolocation.getCurrentPosition(
        pos => {
          userCoords = [pos.coords.latitude, pos.coords.longitude];
          userMarker.setLatLng(userCoords);
          map.setView(userCoords, 16);
          userMarker.bindPopup('<b>¡Ubicación GPS actual detectada!</b>').openPopup();
        },
        () => { if (showAlerts) alert('No se pudo obtener el GPS.'); },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // ---------- Carga de CSV ----------
    function parseCSV(text) {
      return new Promise(resolve => Papa.parse(text, {
        header: true, skipEmptyLines: true,   // sin dynamicTyping: así nombre_via siempre es texto
        complete: r => resolve(r.data)
      }));
    }

    async function tryAutoLoadCSV() {
      const badge = $('loading-badge');
      badge.classList.remove('hidden');
      badge.innerText = 'Cargando bases de datos de calles...';
      let rows = [], ok = 0;
      for (const f of ['direcciones_parte1.csv', 'direcciones_parte2.csv']) {
        try {
          const res = await fetch(f);
          if (res.ok) { rows = rows.concat(await parseCSV(await res.text())); ok++; }
        } catch (e) { console.log('No se pudo cargar ' + f); }
      }
      badge.classList.add('hidden');
      if (ok > 0) {
        prepareData(rows);
        $('sub-header').innerText = `Montevideo peatonal (${allData.length} puntos)`;
        renderMarkers(allData);
      } else {
        $('sub-header').innerText = 'Sube tus archivos CSV para comenzar.';
      }
    }

    async function processCSVData(text, name) {
      const badge = $('loading-badge');
      badge.classList.remove('hidden');
      badge.innerText = 'Cargando direcciones...';
      prepareData(await parseCSV(text));
      $('sub-header').innerText = `${name} (${allData.length} puntos)`;
      badge.classList.add('hidden');
      renderMarkers(allData);
    }

    // ---------- Marcadores ----------
    function renderMarkers(data) {
      markersCluster.clearLayers();
      const list = data.map(r => {
        const label = `${r.via || 'Destino'} #${r.num_puerta || ''}`;
        return L.marker([r.lat, r.lon]).bindPopup(`
          <div class="text-xs leading-relaxed font-sans min-w-[200px] text-slate-800">
            <div class="font-bold text-sm border-b pb-1 mb-2 border-slate-200">${esc(r.via || 'Vía')} #${esc(r.num_puerta || 'S/N')}</div>
            <div><b>Localidad:</b> ${esc(r.localidad || 'N/A')}</div>
            <div><b>CP:</b> ${esc(r.codigo_postal || 'N/A')}</div>
            <button data-n="${esc(label)}" onclick="calculateWalkingRoute(${r.lat}, ${r.lon}, this.dataset.n)"
                    class="mt-3 w-full bg-emerald-600 text-white font-semibold py-1.5 px-2 rounded hover:bg-emerald-500 transition">Caminar hacia aquí 🚶</button>
          </div>`);
      });
      markersCluster.addLayers(list);
    }

    // ---------- Ruta peatonal ----------
    // Nota: router.project-osrm.org solo calcula rutas en auto aunque se pida "foot".
    // Este servidor de OpenStreetMap Alemania sí tiene perfil peatonal real.
    async function calculateWalkingRoute(destLat, destLon, destName) {
      const badge = $('loading-badge');
      badge.classList.remove('hidden');
      badge.innerText = 'Calculando ruta a pie...';
      const url = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${userCoords[1]},${userCoords[0]};${destLon},${destLat}?overview=full&geometries=geojson`;
      try {
        const data = await (await fetch(url)).json();
        if (data.code === 'Ok' && data.routes && data.routes.length) {
          const route = data.routes[0];
          if (routeLineLayer) map.removeLayer(routeLineLayer);
          routeLineLayer = L.polyline(route.geometry.coordinates.map(c => [c[1], c[0]]),
            { color: '#34d399', weight: 6, opacity: 0.9, dashArray: '5, 10' }).addTo(map);
          map.fitBounds(routeLineLayer.getBounds(), { padding: [80, 80] });
          $('route-panel').classList.remove('hidden');
          $('route-dist').innerText = (route.distance / 1000).toFixed(2) + ' km';
          $('route-time').innerText = Math.max(1, Math.round(route.distance / 80)) + ' min';   // ~4,8 km/h
          $('route-dest-name').innerText = `Destino: ${destName}`;
        } else {
          alert('No se encontró una ruta peatonal conectada.');
        }
      } catch (e) {
        alert('Error al conectar con el servidor de rutas.');
      } finally {
        badge.classList.add('hidden');
      }
    }

    function clearRoute() {
      if (routeLineLayer) { map.removeLayer(routeLineLayer); routeLineLayer = null; }
      $('route-panel').classList.add('hidden');
    }

    function distanciaMetros(lat1, lon1, lat2, lon2) {
      const R = 6371e3, rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ---------- Búsqueda ----------
    function filterStreet(q) {
      let m = allData.filter(r => r.viaN === q);                       // coincidencia exacta primero
      return m.length ? m : allData.filter(r => r.viaN.includes(q));   // si no, parcial
    }

    function performSearch() {
      hideSuggestions();
      const raw = input.value.trim();
      if (!raw) { renderMarkers(allData); clearRoute(); return; }

      let { street, number } = parseQuery(raw);
      let matches = filterStreet(norm(street));
      if (!matches.length && number) {          // quizá el número era parte del nombre de la calle
        matches = filterStreet(norm(raw));
        number = null;
      }
      if (!matches.length) { alert('No se encontró ninguna calle con ese nombre.'); return; }

      // 1) Si hay número y existe, ese es el destino
      let dest = number ? matches.find(r => String(r.num_puerta).trim() === number) : null;

      // 2) Si no hay número (o no existe), el punto de esa calle más cercano al usuario
      if (!dest) {
        let min = Infinity;
        for (const r of matches) {
          const d = distanciaMetros(userCoords[0], userCoords[1], r.lat, r.lon);
          if (d < min) { min = d; dest = r; }
        }
      }

      renderMarkers(matches);
      calculateWalkingRoute(dest.lat, dest.lon, `${dest.via} #${dest.num_puerta || 's/n'}`);
    }

    // ---------- Eventos ----------
    $('btn-clear-route').addEventListener('click', clearRoute);
    $('btn-gps').addEventListener('click', () => getGPSLocation(true));
    $('btn-search').addEventListener('click', () => { input.blur(); performSearch(); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); performSearch(); } });
    $('file-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => processCSVData(evt.target.result, file.name);
      reader.readAsText(file);
    });

    window.onload = initMap;
  </script>
</body>
</html>
